services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lightsout
      POSTGRES_USER: lightsout
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-demo-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightsout -d lightsout"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/lightsout
      DATABASE_USER: lightsout
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-local-demo-password}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${UI_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
