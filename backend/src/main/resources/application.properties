spring.application.name=lights-out-factory
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/lightsout}
spring.datasource.username=${DATABASE_USER:lightsout}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
logging.structured.format.console=logstash
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.0}
