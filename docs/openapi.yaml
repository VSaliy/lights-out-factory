openapi: 3.1.0
info:
  title: Lights-Out Factory local workflow API
  version: 0.1.0
  description: Local-only supervised workflow API. Mock execution is simulated and never edits a repository.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/work-items:
    get:
      summary: List persisted work items
      responses:
        '200':
          description: Work items ordered newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WorkItem'}
    post:
      summary: Create a work item
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkItem'}
      responses:
        '201':
          description: Created
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkItem'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/v1/work-items/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: Get a work item and latest plan/run identifiers
      responses:
        '200':
          description: Work item
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkItem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/work-items/{id}/plans:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      summary: Create one deterministic plan with one task
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                summary: {type: string, maxLength: 1000}
      responses:
        '201':
          description: Plan awaiting approval
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/plans/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: Get a plan
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/plans/{id}/approve:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      summary: Approve a plan as the explicit local demo actor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor]
              properties:
                actor: {type: string, const: local-demo}
      responses:
        '200':
          description: Approved plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/plans/{id}/execute:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      summary: Execute the approved task with deterministic mock behavior
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerType]
              properties:
                providerType: {type: string, enum: [mock]}
                scenario: {type: string, enum: [SUCCESS, FAILURE, TIMEOUT], default: SUCCESS}
      responses:
        '200':
          description: Simulated execution and independently evaluated gate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Execution'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/executions/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: Get an execution and persisted quality-gate evidence
      responses:
        '200':
          description: Execution details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Execution'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/work-items/{id}/complete:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      summary: Mark a reviewed work item complete after a passing gate
      responses:
        '200':
          description: Completed work item
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkItem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/work-items/{id}/audit-events:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: List correlated audit events for a work item
      responses:
        '200':
          description: Audit timeline
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AuditEvent'}
  /actuator/health:
    get:
      summary: Spring Boot health endpoint
      responses:
        '200':
          description: Health status
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    CreateWorkItem:
      type: object
      required: [title, description, acceptanceCriteria]
      properties:
        title: {type: string, maxLength: 160}
        description: {type: string, maxLength: 4000}
        acceptanceCriteria: {type: string, maxLength: 4000}
        priority: {type: string, enum: [P1, P2, P3], default: P2}
    WorkItem:
      allOf:
        - {$ref: '#/components/schemas/CreateWorkItem'}
        - type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            id: {type: string, format: uuid}
            status: {type: string}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
            latestPlanId: {type: string, format: uuid, nullable: true}
            latestPlanStatus: {type: string, nullable: true}
            latestExecutionId: {type: string, format: uuid, nullable: true}
    Plan:
      type: object
      properties:
        id: {type: string, format: uuid}
        workItemId: {type: string, format: uuid}
        summary: {type: string}
        status: {type: string}
        approvedBy: {type: string, nullable: true}
        approvedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
    Execution:
      type: object
      properties:
        id: {type: string, format: uuid}
        planId: {type: string, format: uuid}
        providerType: {type: string, enum: [mock]}
        status: {type: string}
        simulated: {type: boolean, const: true}
        outputSummary: {type: string, nullable: true}
        errorCode: {type: string, nullable: true}
        correlationId: {type: string, format: uuid}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time, nullable: true}
        gateName: {type: string}
        gateStatus: {type: string, enum: [PASSED, FAILED]}
        gateEvidence: {type: string}
        gateEvaluatedAt: {type: string, format: date-time}
    AuditEvent:
      type: object
      properties:
        id: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        actor: {type: string}
        action: {type: string}
        resourceType: {type: string}
        resourceId: {type: string, format: uuid}
        correlationId: {type: string, format: uuid}
    Problem:
      type: object
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
